<!doctype html><meta charset="utf-8"><title>Stock (test copy)</title>
<style>body{font-family:sans-serif}.row{display:flex;gap:12px;padding:6px;border-bottom:1px solid #eee}.pop{border:1px solid #ccc;position:absolute;background:#fff;z-index:9}[role=dialog]{border:2px solid #333;padding:12px;margin:12px}</style>
<button type="button" id="addBtn">+ Add ingredient</button>
<div id="rows"></div><div id="dlgBox"></div>
<script>
window.saved=0; window.lastSave=null;
const UNITS=['تەبەقە','جام','دانە','سیت','کارتۆن','لتر','ملی لتر','غرام','کیلۆ'];
const ITEMS=[{name:'Big Lebanese Bread - نانی لبنانی گەورە',usage:'دانە',buying:'سیت',counting:'سیت',conv:{'سیت>دانە':6},low:''},
  {name:'Tomato - تەماتە',usage:'غرام',buying:'کارتۆن',counting:'کیلۆ',conv:{'کیلۆ>غرام':1000,'کارتۆن>کیلۆ':10},low:'5'}];
function paintRows(){document.getElementById('rows').innerHTML=ITEMS.map((it,i)=>`<div class="row"><span>${it.name}</span><span>12 ${it.counting}</span><button type="button" title="View">👁</button><button type="button" title="Edit" data-edit="${i}">✎</button></div>`).join('');
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(ITEMS[+b.dataset.edit]))}
function popup(anchor,list,onPick){
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  const pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','listbox');
  const r=anchor.getBoundingClientRect();pop.style.left=r.left+'px';pop.style.top=(r.bottom+scrollY)+'px';
  const input=document.createElement('input');input.placeholder='Search';pop.append(input);const box=document.createElement('div');pop.append(box);
  const paint=q=>{box.innerHTML='';list.filter(x=>!q||x.includes(q)).forEach(x=>{const o=document.createElement('div');o.setAttribute('role','option');o.textContent=x;o.onclick=()=>{pop.remove();onPick(x)};box.append(o)})};
  paint('');document.body.append(pop);input.oninput=()=>paint(input.value);input.focus();
}
function openForm(it){
  const edit=!!it; const st=edit?{...it,conv:{...it.conv}}:{name:'',usage:'',buying:'',counting:'',conv:{},low:''};
  const d=document.getElementById('dlgBox');
  const draw=()=>{
    const B=st.buying||st.usage, C=st.counting||st.usage, need=[];
    if(st.usage&&C!==st.usage)need.push([C,st.usage]); if(st.usage&&B!==C)need.push([B,C]);
    d.innerHTML=`<div role="dialog"><h2>${edit?'Edit ingredient':'Add a new ingredient'}</h2>
      <div>Ingredient name</div><input id="nm" value="${st.name}">
      <div>Usage Format (recipe unit)</div>${edit?`<div><span>${st.usage}</span> ✓</div>`:`<button type="button" id="us">${st.usage||'— Select the recipe unit —'}</button>`}
      <div>Buying Format</div><button type="button" id="by">${st.buying&&st.buying!==st.usage?st.buying:'— same as usage —'}</button>
      <div>Inventory (counting) Format</div><button type="button" id="ct">${st.counting&&st.counting!==st.usage?st.counting:'— same as usage —'}</button>
      ${need.map(([a,b])=>`<div><div>1 ${a} = ? ${b}</div><input data-k="${a}>${b}" value="${st.conv[a+'>'+b]??''}"></div>`).join('')}
      <div>Warn me when stock drops to</div><input id="lw" placeholder="e.g. 500" value="${st.low}">
      <button type="button" id="close">Close</button><button type="button" id="ok">${edit?'Save':'Add ingredient'}</button></div>`;
    const keep=()=>{st.name=document.getElementById('nm').value;st.low=document.getElementById('lw').value;d.querySelectorAll('[data-k]').forEach(i=>st.conv[i.dataset.k]=i.value)};
    if(!edit)document.getElementById('us').onclick=e=>{keep();popup(e.target,UNITS,x=>{st.usage=x;draw()})};
    document.getElementById('by').onclick=e=>{keep();popup(e.target,['— same as usage —',...UNITS],x=>{st.buying=x==='— same as usage —'?st.usage:x;draw()})};
    document.getElementById('ct').onclick=e=>{keep();popup(e.target,['— same as usage —',...UNITS],x=>{st.counting=x==='— same as usage —'?st.usage:x;draw()})};
    document.getElementById('close').onclick=()=>{d.innerHTML=''};
    document.getElementById('ok').onclick=()=>{keep();window.saved++;window.lastSave=JSON.parse(JSON.stringify(st));d.innerHTML='<div>'+(edit?'Changes saved':'Ingredient added')+'</div>'};
  };
  draw();
}
document.getElementById('addBtn').onclick=()=>openForm(null);
paintRows();
</script>
