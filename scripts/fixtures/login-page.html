<!doctype html><html><head><meta charset="utf-8"><title>Ricotta Restaurant</title></head>
<body>
<!-- A local copy of the workplace sign-in screen: Password / PIN tabs, PIN dots, keypad, Clear, backspace. -->
<main>
  <h2>Sign in</h2><p>Sign in to manage your restaurant</p>
  <div role="tablist"><button id="tPw" role="tab" aria-selected="false">Password</button><button id="tPin" role="tab" aria-selected="false">PIN</button></div>
  <section id="pw"><label>Email <input></label><label>Password <input type="password"></label><button>Sign in</button></section>
  <section id="pin" hidden>
    <label>Enter your PIN</label><div id="dots"></div>
    <div id="pad"></div>
    <p id="err" role="alert"></p>
  </section>
</main>
<script>
  const GOOD = new URLSearchParams(location.search).get('good') || '123456';
  let typed = '';
  const pin = document.getElementById('pin'), pw = document.getElementById('pw');
  document.getElementById('tPin').onclick = () => { pin.hidden = false; pw.hidden = true; };
  document.getElementById('tPw').onclick = () => { pin.hidden = true; pw.hidden = false; };
  const pad = document.getElementById('pad');
  for (const k of ['1','2','3','4','5','6','7','8','9','Clear','0','⌫']) {
    const b = document.createElement('button'); b.textContent = k; if (k === '⌫') b.setAttribute('aria-label', 'Delete');
    b.onclick = () => {
      if (k === 'Clear') typed = ''; else if (k === '⌫') typed = typed.slice(0, -1); else typed += k;
      document.getElementById('dots').textContent = '•'.repeat(typed.length);
      if (typed.length === 6) setTimeout(() => {
        if (typed === GOOD) location.href = '/inventory/transfer';
        else { document.getElementById('err').textContent = 'Wrong PIN'; typed = ''; window.wrongTries = (window.wrongTries || 0) + 1; }
      }, 150);
    };
    pad.appendChild(b);
  }
</script></body></html>
