<!doctype html><meta charset="utf-8"><title>New purchase receipt (test copy)</title>
<style>body{font-family:sans-serif}.lab{text-transform:uppercase;font-size:11px}.pop{border:1px solid #ccc;position:absolute;background:#fff;z-index:9}.row{border:1px solid #ddd;margin:8px;padding:8px}</style>
<h1>New purchase receipt</h1>
<div><div>Supplier</div><button id="sup" type="button">Select</button></div>
<div><div>Zone</div><button type="button">Main Storage</button></div>
<div><div>Invoice number</div><input id="inv" placeholder="e.g. 1024"></div>
<div><div>Currency</div><button type="button" id="iqd">IQD</button><button type="button" id="usd">USD $</button><div id="rateBox"></div></div>
<div><div>Delivery</div><button type="button" id="del">No delivery</button><div id="delBox"></div></div>
<div><div>Items received</div><div id="rows"></div><button type="button" id="add">Add item</button></div>
<div>Total: <b id="total">$ 0</b></div><button type="button" id="cancel">Cancel</button><button type="button" id="receive">Receive &amp; send to finance</button>
<script>
window.submitted=0;
const SUPPLIERS=['Ali Market','Fresh Foods','Fresh Foods Co'];
const ITEMS={'Tomato - تەماتە':['غرام','کیلۆ (×1000)'],'Cherry Tomatoes - تەماتە کرزی':['غرام','کیلۆ (×1000)'],'Blueberry Ice Cream - ئایس کریمی بلوبێری':['غرام','پاکەت (×3000)','پاکەت (×3000)','+ Add a different unit...'],'Odd Item':['دانە (×1)','دانە (×6)']};
let currency='IQD';
function popup(anchor,list,withSearch,onPick){
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  const pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','listbox');
  const r=anchor.getBoundingClientRect();pop.style.left=r.left+'px';pop.style.top=(r.bottom+window.scrollY)+'px';
  let input=null;
  if(withSearch){input=document.createElement('input');input.placeholder='Search';pop.append(input);}
  const box=document.createElement('div');pop.append(box);
  const paint=q=>{box.innerHTML='';list.filter(x=>!q||x.toLowerCase().includes(q.toLowerCase())).forEach(x=>{const o=document.createElement('div');o.setAttribute('role','option');o.textContent=x;o.onclick=()=>{pop.remove();onPick(x)};box.append(o)})};
  paint('');document.body.append(pop);
  if(input){input.oninput=()=>paint(input.value);input.focus();}
}
document.getElementById('sup').onclick=e=>popup(e.target,SUPPLIERS,true,x=>e.target.textContent=x);
document.getElementById('usd').onclick=()=>{currency='USD';document.getElementById('rateBox').innerHTML="<div>Today's rate (1 USD → IQD)</div><input placeholder='1500'>";calc()};
document.getElementById('del').onclick=e=>{e.target.textContent='Delivery: On';document.getElementById('delBox').innerHTML='<div>How much was the delivery?</div><input placeholder="10,000">'};
document.getElementById('receive').onclick=()=>{window.submitted=(window.submitted||0)+1;const ok=document.createElement('div');ok.textContent='Receipt received';document.body.append(ok)};
const fmt=n=>(currency==='USD'?'$ ':'IQD ')+n.toLocaleString('en-US');
function calc(){let t=0;document.querySelectorAll('.row').forEach(r=>{const [q,c]=r.querySelectorAll('input');const v=(Number(q.value)||0)*(Number(String(c.value).replace(/,/g,''))||0);r.querySelector('.tot').textContent=v?fmt(v):'—';t+=v});document.getElementById('total').textContent=fmt(t)}
function addRow(){
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<div class="lab">Item</div><button type="button" class="it">Search item...</button><div><span class="lab">Unit</span> <span class="lab">Qty</span> <span class="lab">Unit cost</span> <span class="lab">Total</span></div><button type="button" class="un">Base unit</button><input placeholder="0"><input placeholder="0"><span class="tot">—</span><button type="button" class="del">🗑</button>';
  const it=r.querySelector('.it'),un=r.querySelector('.un');
  it.onclick=()=>popup(it,Object.keys(ITEMS),true,x=>{it.textContent=x;un.textContent=ITEMS[x][0]});
  un.onclick=()=>{if(ITEMS[it.textContent])popup(un,ITEMS[it.textContent],false,x=>{if(!x.startsWith('+'))un.textContent=x})};
  r.querySelectorAll('input').forEach(i=>i.oninput=calc);
  document.getElementById('rows').append(r);
}
document.getElementById('add').onclick=addRow;addRow();
</script>
