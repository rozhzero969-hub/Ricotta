  /* Solid dark green in light and dark mode. A green bar paints the word in, the dot pops,
     and the bar below fills while the app loads (it completes as the screen lifts). */
  .splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
    background:#14382C linear-gradient(160deg,#1D4E3C 0%,#14382C 52%,#0D281F 100%);
    color:#F2F7F4;direction:ltr;font-family:'RicottaMark','Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none}
  .splash-rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .splash-rings i{position:absolute;width:min(78vmin,560px);aspect-ratio:1;border-radius:50%;
    border:1px solid rgba(255,255,255,.12);animation:spRing 7s cubic-bezier(.2,.7,.2,1) infinite}
  .splash-rings i:nth-child(2){animation-delay:3.5s}
  .splash-inner{position:relative;display:flex;flex-direction:column;align-items:center}
  .splash-mark{display:flex;align-items:flex-end;font-size:clamp(50px,18vw,80px)}
  .splash-reveal{position:relative}
  .splash-word{font-weight:800;letter-spacing:-.045em;line-height:1;padding:.06em .02em .1em .08em;clip-path:inset(0 100% 0 0);
    animation:spReveal .8s cubic-bezier(.7,0,.2,1) .15s forwards}
  .splash-wipe{position:absolute;top:0;bottom:0;left:0;width:.42em;border-radius:.08em;background:#34C27A;
    animation:spWipe .8s cubic-bezier(.7,0,.2,1) .15s both,spWipeOut .2s ease-out .95s forwards}
  .splash-dot{flex:none;width:.2em;height:.2em;margin:0 .08em .18em .05em;border-radius:50%;background:#34C27A;
    transform:scale(0);animation:spDot .55s cubic-bezier(.34,1.8,.5,1) .85s forwards,spGlow 2.2s ease-in-out 1.5s infinite}
  .splash-sub{margin-top:16px;font-size:12px;font-weight:800;letter-spacing:1em;text-indent:1em;
    color:rgba(242,247,244,.64);opacity:0;animation:spTrack 1s cubic-bezier(.2,.8,.2,1) .55s forwards}
  .splash-bar{position:relative;margin-top:34px;width:132px;height:3px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.14);opacity:0;animation:spFade .5s ease .85s forwards}
  .splash-bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:#34C27A;
    animation:spFill 3.2s cubic-bezier(.2,.6,.3,1) .85s forwards}
  /* Needs no script: if the app has not started after 15 seconds, a way out appears. */
  .splash-retry{position:absolute;left:50%;bottom:calc(44px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 22px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#F2F7F4;font:600 14px/1.2 system-ui,-apple-system,'Segoe UI',sans-serif;
    text-decoration:none;white-space:nowrap;visibility:hidden;opacity:0;animation:spRetry .4s ease 15s forwards}
  @keyframes spRetry{to{visibility:visible;opacity:1}}
  .splash[data-state=leaving]{animation:spCurtain .28s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
  .splash[data-state=leaving] .splash-inner{animation:spInnerOut .38s cubic-bezier(.4,0,.2,1) forwards}
  .splash-bar::after{content:'';position:absolute;inset:0;border-radius:3px;background:#34C27A;opacity:0}
  .splash[data-state=leaving] .splash-bar::after{animation:spFade .2s ease-out forwards}
  @keyframes spReveal{to{clip-path:inset(0 0 0 0)}}
  @keyframes spWipe{from{left:0}to{left:100%}}
  @keyframes spWipeOut{to{opacity:0}}
  @keyframes spDot{to{transform:scale(1)}}
  @keyframes spGlow{0%,100%{box-shadow:0 0 0 0 rgba(52,194,122,.55)}50%{box-shadow:0 0 0 .22em rgba(52,194,122,0)}}
  @keyframes spTrack{from{opacity:0;letter-spacing:1.6em}to{opacity:1;letter-spacing:1em}}
  @keyframes spFade{to{opacity:1}}
  @keyframes spFill{to{width:85%}}
  @keyframes spRing{0%{transform:scale(.35);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}
  @keyframes spInnerOut{to{transform:translateY(-6px);opacity:0}}
  @keyframes spCurtain{to{opacity:0;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){
    .splash *,.splash{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
    .splash-wipe{display:none}
    .splash .splash-retry{animation-delay:15s!important}
