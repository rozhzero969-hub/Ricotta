<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152B22">
<title>Ricotta Orders</title>
<!-- Home Screen install + notifications: iOS only allows push for sites
     that have a manifest and are opened from the Home Screen icon. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ricotta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Vazirmatn:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<!-- Load order matters: config.js must come before storage.js and app.js
     (both read SUPABASE_URL/SUPABASE_ANON_KEY/DEFAULT_UNITS while loading).
     Everything else is only used inside function bodies, called after all
     scripts have loaded, so their relative order doesn't matter. app.js
     must be last since it calls boot() immediately. -->
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="storage.js"></script>
<script src="modals.js"></script>
<script src="push.js"></script>
<script src="app.js"></script>
<script src="update-check.js"></script>
</body>
</html>
