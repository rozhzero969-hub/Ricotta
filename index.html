  html.booting,html.booting body{background:#0E1F18;overflow:hidden;margin:0}
  .splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 38%,#20513b 0%,#152B22 46%,#0B1812 100%);
    color:#fff;direction:ltr;font-family:'RicottaMark','Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none}
  .splash-rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .splash-rings i{position:absolute;width:min(78vmin,560px);aspect-ratio:1;border-radius:50%;
    border:1px solid rgba(111,207,154,.13);animation:ringOut 3.6s cubic-bezier(.2,.7,.2,1) infinite}
  .splash-rings i:nth-child(2){animation-delay:1.8s}
  .splash-inner{position:relative;display:flex;flex-direction:column;align-items:center}
  .splash-word{display:flex;align-items:flex-end;font-weight:800;font-size:clamp(46px,13vw,76px);
    letter-spacing:-.045em;line-height:1;overflow:hidden;padding:.06em .08em .1em}
  .splash-word span{display:inline-block;transform:translateY(105%);opacity:0;
    animation:letterUp .4s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(var(--i)*30ms + 40ms)}
  .splash-word .splash-dot{width:.2em;height:.2em;margin:0 0 .08em .07em;border-radius:50%;background:#6FCF9A;
    transform:scale(0);opacity:1;animation:dotPop .6s cubic-bezier(.34,1.8,.5,1) .62s forwards,dotGlow 2.2s ease-in-out 1.3s infinite}
  .splash-sub{margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.9em;text-indent:.9em;
    color:rgba(255,255,255,.58);opacity:0;animation:trackIn 1s cubic-bezier(.2,.8,.2,1) .55s forwards}
  .splash-bar{position:relative;margin-top:34px;width:132px;height:3px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.1);opacity:0;animation:fadeIn .5s ease .85s forwards}
  .splash-bar i{position:absolute;inset:0 auto 0 0;width:42%;border-radius:3px;
    background:linear-gradient(90deg,rgba(111,207,154,0),#6FCF9A,rgba(111,207,154,0));
    animation:sweep 1.15s cubic-bezier(.45,.05,.55,.95) infinite}
  .splash[data-state=leaving]{animation:curtain .28s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
  .splash[data-state=leaving] .splash-inner{animation:innerOut .38s cubic-bezier(.4,0,.2,1) forwards}
  .splash[data-state=leaving] .splash-bar i{animation:fillUp .3s ease-out forwards}
  @keyframes letterUp{to{transform:translateY(0);opacity:1}}
  @keyframes dotPop{to{transform:scale(1)}}
  @keyframes dotGlow{0%,100%{box-shadow:0 0 0 0 rgba(111,207,154,.55)}50%{box-shadow:0 0 0 .22em rgba(111,207,154,0)}}
  @keyframes trackIn{from{opacity:0;letter-spacing:1.6em}to{opacity:1;letter-spacing:.9em}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
  @keyframes fillUp{to{width:100%;transform:none;background:#6FCF9A}}
  @keyframes ringOut{0%{transform:scale(.35);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}
  @keyframes innerOut{to{transform:translateY(-6px);opacity:0}}
  @keyframes curtain{to{opacity:0;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){
    .splash *,.splash{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  }

<!-- Stylesheets load without blocking the first paint (the splash covers the
     app until they're in; app.js waits for them before revealing it). -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preload" href="style.css" as="style">

<body>
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-rings"><i></i><i></i></div>
  <div class="splash-inner">
    <div class="splash-word"><span style="--i:0">r</span><span style="--i:1">i</span><span style="--i:2">c</span><span style="--i:3">o</span><span style="--i:4">t</span><span style="--i:5">t</span><span style="--i:6">a</span><span class="splash-dot"></span></div>
    <div class="splash-sub">ORDERS</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>
<div class="ambient" aria-hidden="true"><i></i></div>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Ricotta Orders needs JavaScript turned on.</p></noscript>
<!-- Load order matters: config.js first (constants), app.js last but one
     (it calls boot()). `defer` downloads them in parallel and runs them in
     this order once the page is parsed. -->
<script defer src="config.js"></script>
<script defer src="icons.js"></script>
<script defer src="i18n.js"></script>
<script defer src="storage.js"></script>
<script defer src="modals.js"></script>
<script defer src="push.js"></script>
<script defer src="assistant.js"></script>
<script defer src="app.js"></script>
<script defer src="update-check.js"></script>
</body>
