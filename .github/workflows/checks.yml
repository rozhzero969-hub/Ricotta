name: Checks

# Runs the repo's two local smoke tests on every push and PR to main. Neither
# test calls the live Supabase project or any real API key -- both mock
# everything (see the header comment in each script).
# This is the one thing standing between "someone pushes a change" and "Rico
# or the app breaks in production with nobody noticing until a kitchen shift
# hits it" -- there was no CI here before.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check supabase/functions/api/index.ts supabase/functions/send-push/index.ts supabase/functions/stock-api/index.ts

      - name: Stock database smoke test (real Postgres, rolled back)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          for i in $(seq 1 30); do PGPASSWORD=postgres psql -h localhost -U postgres -c 'select 1' >/dev/null 2>&1 && break; sleep 1; done
          export PGPASSWORD=postgres PGHOST=localhost PGUSER=postgres
          psql -v ON_ERROR_STOP=1 -q -c "create role anon; create role authenticated; create role service_role;"
          psql -v ON_ERROR_STOP=1 -q -c "create table app_units(id text primary key, en text not null); create table app_items(id text primary key, name text not null, unit_id text references app_units(id) on delete set null); create table app_accounts(id text primary key);"
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930150000_stock_and_transfers.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930151000_stock_tabs.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930160000_stock_transfer_units.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930170000_stock_worker_control.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930180000_stock_fk_indexes.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930200000_stock_workplace_name.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20260930210000_stock_zones.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001100000_stock_worker_health.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001120000_stock_receipts.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001150000_stock_receipt_final.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001160000_stock_worker_receipts_live.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001180000_stock_item_jobs.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001181000_stock_worker_items_live.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261001200000_stock_groups.sql
          psql -v ON_ERROR_STOP=1 -q -f scripts/stock-db-smoke.sql

      - name: No undefined names in the app scripts
        run: |
          cat config.js icons.js i18n.js storage.js sounds.js modals.js push.js assistant.js stock.js app.js update-check.js > .lint-all.js
          npx --yes eslint@9 --config scripts/eslint.undef.config.cjs .lint-all.js

      - name: Rico provider smoke test (Gemini + Groq, mocked)
        run: node --experimental-strip-types scripts/rico-provider-smoke.mjs

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium

      - name: UI smoke test (mocked API, six widths, EN + KU + AR)
        run: node scripts/ui-smoke.cjs

      - name: Stock and transfer UI smoke test (mocked API, EN + KU + AR)
        run: node scripts/stock-ui-smoke.cjs

      - name: PC worker receipt filler (local copy of the workplace page)
        run: node scripts/receipt-worker-smoke.mjs

      - name: PC worker ingredient create/edit (local copy of the workplace stock page)
        run: node scripts/items-worker-smoke.mjs

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: ${{ runner.temp }}/ricotta-ui-*/**
          if-no-files-found: ignore
          retention-days: 14
