<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages shows this for any address under /Ricotta/ that doesn't exist. A plain page: no scripts;
     only the app's own fonts load. Links are absolute because it is shown at whatever address was typed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>Page Not Found · Ricotta Orders</title>
<link rel="icon" href="/Ricotta/icon-192.png">
<link rel="stylesheet" href="/Ricotta/fonts/fonts.css">
<style>
  :root{--bg:#F2F2F7;--card:#fff;--ink:#000;--soft:#6E6E73;--word:#14382C;--dot:#34C27A;--button:#1F7A4D;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#fff;--soft:#98989F;--word:#F2F2F7;--button:#1F7A4D;color-scheme:dark}}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,'Noto Kufi Arabic',sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:440px;padding:calc(28px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  .word{display:inline-flex;align-items:flex-end;margin:0 0 36px;font:800 2.125rem/1 'Manrope',-apple-system,system-ui,sans-serif;letter-spacing:-.055em;color:var(--word)}
  .word i{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--dot);margin:0 0 .09em .07em}
  .code{margin:0 0 6px;font-size:.8125rem;font-weight:600;letter-spacing:.04em;color:var(--soft)}
  h1{margin:0 0 8px;font-size:1.75rem;line-height:1.2;letter-spacing:-.01em}
  p{margin:0;color:var(--soft);font-size:1.0625rem}
  .other{margin:24px 0 32px;padding:16px 18px;border-radius:22px;background:var(--card)}
  .other div+div{margin-top:12px}
  .other b{display:block;font-weight:600;color:var(--ink)}
  .other p{font-size:.9375rem}
  [lang=ckb],[lang=ar]{font-family:'Noto Kufi Arabic',-apple-system,system-ui,sans-serif;line-height:1.8}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;border-radius:999px;background:var(--button);color:#fff;
    font-size:1.0625rem;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(.2,.8,.2,1)}
  a:active{transform:scale(.96)}
  a:focus-visible{outline:3px solid var(--dot);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
  <div class="word" dir="ltr" role="img" aria-label="Ricotta">ricotta<i aria-hidden="true"></i></div>
  <p class="code">404</p>
  <h1>This page doesn’t exist</h1>
  <p>The link may be old or mistyped.</p>
  <div class="other">
    <div lang="ckb" dir="rtl"><b>ئەم پەڕەیە بوونی نییە</b><p>لەوانەیە بەستەرەکە کۆن بێت یان بە هەڵە نووسرابێت.</p></div>
    <div lang="ar" dir="rtl"><b>هذه الصفحة غير موجودة</b><p>ربما يكون الرابط قديمًا أو مكتوبًا بشكل خاطئ.</p></div>
  </div>
  <a href="/Ricotta/">Open Ricotta</a>
</main>
</body>
</html>
